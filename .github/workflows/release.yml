# Builds installers for Linux, macOS and Windows whenever a version tag
# (e.g. v0.2.0) is pushed, and attaches them to a draft GitHub Release.
# Start one with: scripts/release.sh 0.2.0   (see docs/RELEASING.md)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # "Run workflow" button in the Actions tab (builds the chosen tag)

jobs:
  build:
    permissions:
      contents: write # needed to create the release and upload files
    strategy:
      fail-fast: false # one OS failing shouldn't cancel the others
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin # one app for Intel + Apple Silicon
          - platform: ubuntu-22.04 # older Ubuntu = works on more distros
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ncpass ${{ github.ref_name }}
          releaseBody: |
            Download the file for your system below:
            - **Windows**: `.msi` (or the `-setup.exe`)
            - **macOS**: `.dmg` (first launch: right-click the app → Open, because it isn't signed)
            - **Linux**: `.deb` (Ubuntu/Debian), `.rpm` (Fedora) or `.AppImage` (any distro)
          releaseDraft: true
          args: ${{ matrix.args }}
